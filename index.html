<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sydney</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Sydney</h1>
    <form id="paste">
      <input id="url" type="text" inputmode="url" placeholder="Paste a reel link" autocomplete="off">
      <button type="submit">Update the trip</button>
      <details>
        <summary>Add the caption if this reel is new</summary>
        <textarea id="caption" rows="5" placeholder="Paste the caption"></textarea>
      </details>
      <details>
        <summary>Google lookup, optional</summary>
        <p class="quiet">A Gemini key stays on this phone. It is not part of the GitHub project. With a key, a new link is searched, then the places are pinned.</p>
        <input id="gemini" type="password" placeholder="Gemini API key" autocomplete="off">
        <button type="button" id="save-key">Save key on this phone</button>
      </details>
    </form>
    <p id="status"></p>
    <div id="map"></div>
    <p id="total" class="quiet"></p>
    <p id="reel-link" class="quiet"></p>
    <div id="list"></div>
    <div class="tools">
      <button type="button" class="text" id="export">Export</button>
      <label class="text">Import<input id="import" type="file" accept="application/json" hidden></label>
      <button type="button" class="text" id="reset">Reset</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
